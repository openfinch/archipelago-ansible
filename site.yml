- name: Deploy Archipelago server
  hosts: archipelago
  become: true
  vars:
    install_dir: "{{ archipelago_root }}/{{ archipelago_version }}"
    seeds_dir: "{{ archipelago_root }}/seeds"

  tasks:
    - name: Check values that are written into the systemd unit
      ansible.builtin.assert:
        that:
          - archipelago_password is match('^[A-Za-z0-9_.-]*$')
          - archipelago_server_password is match('^[A-Za-z0-9_.-]*$')
        fail_msg: Passwords may only contain letters, digits, '-', '_' and '.'.
        quiet: true

    - name: Create service user
      ansible.builtin.user:
        name: archipelago
        system: true
        home: "{{ archipelago_root }}"
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: archipelago
        group: archipelago
        mode: "0755"
      loop:
        - "{{ archipelago_root }}"
        - "{{ install_dir }}"
        - "{{ seeds_dir }}"
        - "{{ archipelago_root }}/players"
        - "{{ archipelago_root }}/custom_worlds"

    - name: Download release
      ansible.builtin.get_url:
        url: "https://github.com/ArchipelagoMW/Archipelago/releases/download/{{ archipelago_version }}/Archipelago_{{ archipelago_version }}_linux-x86_64.tar.gz"
        dest: "{{ archipelago_root }}/Archipelago_{{ archipelago_version }}.tar.gz"
        checksum: "sha256:{{ archipelago_sha256 }}"
        mode: "0644"

    - name: Extract release
      ansible.builtin.unarchive:
        src: "{{ archipelago_root }}/Archipelago_{{ archipelago_version }}.tar.gz"
        dest: "{{ install_dir }}"
        remote_src: true
        extra_opts: [--strip-components=1]
        creates: "{{ install_dir }}/ArchipelagoServer"
        owner: archipelago
        group: archipelago

    # custom_worlds lives outside the versioned install so upgrades keep it.
    - name: Link custom_worlds into the install
      ansible.builtin.file:
        src: "{{ archipelago_root }}/custom_worlds"
        dest: "{{ install_dir }}/custom_worlds"
        state: link
        owner: archipelago
        group: archipelago

    - name: Point current at this version
      ansible.builtin.file:
        src: "{{ install_dir }}"
        dest: "{{ archipelago_root }}/current"
        state: link
        owner: archipelago
        group: archipelago
      notify: Restart archipelago

    - name: Upload player options and custom worlds
      ansible.builtin.copy:
        src: "{{ archipelago_files_dir }}/{{ item }}/"
        dest: "{{ archipelago_root }}/{{ item }}/"
        owner: archipelago
        group: archipelago
        mode: "0644"
      loop: [players, custom_worlds]

    - name: Find uploaded files on the server
      ansible.builtin.find:
        paths: "{{ archipelago_root }}/{{ item }}"
        hidden: true
      loop: [players, custom_worlds]
      register: remote_files

    - name: Remove files that were deleted locally
      ansible.builtin.file:
        path: "{{ item.1.path }}"
        state: absent
      loop: "{{ remote_files.results | subelements('files') }}"
      loop_control:
        label: "{{ item.1.path }}"
      when: (archipelago_files_dir ~ '/' ~ item.0.item ~ '/' ~ (item.1.path | basename)) is not exists

    - name: Upload pre-generated seed
      ansible.builtin.copy:
        src: "{{ archipelago_seed_file }}"
        dest: "{{ seeds_dir }}/"
        owner: archipelago
        group: archipelago
        mode: "0644"
      when: archipelago_seed_file | length > 0

    - name: Find existing seeds
      ansible.builtin.find:
        paths: "{{ seeds_dir }}"
        patterns: "AP_*.zip"
      register: existing_seeds

    - name: Generate seed from players/
      ansible.builtin.command:
        argv:
          - "{{ archipelago_root }}/current/ArchipelagoGenerate"
          - --player_files_path
          - "{{ archipelago_root }}/players"
          - --outputpath
          - "{{ seeds_dir }}"
        chdir: "{{ archipelago_root }}/current"
        stdin: ""
      become_user: archipelago
      changed_when: true
      when:
        - archipelago_seed_file | length == 0
        - archipelago_regenerate | bool or existing_seeds.matched == 0

    - name: Find seeds after generation
      ansible.builtin.find:
        paths: "{{ seeds_dir }}"
        patterns: "AP_*.zip"
      register: seeds

    - name: Select seed to host
      ansible.builtin.set_fact:
        archipelago_seed_path: >-
          {{ (seeds_dir ~ '/' ~ (archipelago_seed_file | basename))
             if archipelago_seed_file | length > 0
             else (seeds.files | sort(attribute='mtime') | last).path }}

    - name: Install systemd unit
      ansible.builtin.template:
        src: archipelago.service.j2
        dest: /etc/systemd/system/archipelago.service
        mode: "0600"
      notify: Restart archipelago

    - name: Enable and start service
      ansible.builtin.systemd_service:
        name: archipelago
        enabled: true
        state: started
        daemon_reload: true

    - name: Install Discord notifier
      when: archipelago_discord_webhook_url | length > 0
      block:
        - name: Install forwarder script
          ansible.builtin.copy:
            src: discord-forwarder.py
            dest: "{{ archipelago_root }}/discord-forwarder.py"
            mode: "0644"
          notify: Restart archipelago-discord

        - name: Write notifier config
          ansible.builtin.copy:
            content: "{{ {'webhook_url': archipelago_discord_webhook_url, 'mentions': archipelago_discord_mentions | dict2items | selectattr('value') | items2dict} | to_nice_json }}\n"
            dest: /etc/archipelago-discord.json
            mode: "0600"
          notify: Restart archipelago-discord

        - name: Install notifier systemd unit
          ansible.builtin.template:
            src: archipelago-discord.service.j2
            dest: /etc/systemd/system/archipelago-discord.service
            mode: "0644"
          notify: Restart archipelago-discord

        - name: Enable and start notifier
          ansible.builtin.systemd_service:
            name: archipelago-discord
            enabled: true
            state: started
            daemon_reload: true

    - name: Read player list from the hosted seed
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sys, zipfile
            z = zipfile.ZipFile(sys.argv[1])
            names = [n for n in z.namelist() if n.endswith("_Spoiler.txt")]
            print(z.read(names[0]).decode("utf-8-sig") if names else "")
          - "{{ archipelago_seed_path }}"
      register: spoiler
      changed_when: false

    # Holds the players, address and password. The Discord welcome is posted
    # only when this text changes (or on request).
    - name: Write welcome message
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', 'discord-welcome.j2') }}"
        dest: "{{ archipelago_root }}/welcome.txt"
        mode: "0600"
      register: welcome

    - name: Post Discord welcome message
      ansible.builtin.uri:
        url: "{{ archipelago_discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "{{ lookup('ansible.builtin.template', 'discord-welcome.j2') }}"
          allowed_mentions:
            parse: []
        status_code: [200, 204]
      when:
        - archipelago_discord_webhook_url | length > 0
        - welcome is changed or archipelago_discord_welcome | bool

    - name: Install web tracker
      when: archipelago_tracker_listen_host | length > 0
      block:
        - name: Download standalone Python for the tracker
          ansible.builtin.get_url:
            url: "https://github.com/astral-sh/python-build-standalone/releases/download/{{ archipelago_tracker_python_release }}/cpython-{{ archipelago_tracker_python_version }}%2B{{ archipelago_tracker_python_release }}-x86_64-unknown-linux-gnu-install_only.tar.gz"
            dest: "{{ archipelago_root }}/python-{{ archipelago_tracker_python_version }}.tar.gz"
            checksum: "sha256:{{ archipelago_tracker_python_sha256 }}"
            mode: "0644"

        - name: Create Python directory
          ansible.builtin.file:
            path: "{{ archipelago_root }}/python-{{ archipelago_tracker_python_version }}"
            state: directory
            mode: "0755"

        - name: Extract standalone Python
          ansible.builtin.unarchive:
            src: "{{ archipelago_root }}/python-{{ archipelago_tracker_python_version }}.tar.gz"
            dest: "{{ archipelago_root }}/python-{{ archipelago_tracker_python_version }}"
            remote_src: true
            extra_opts: [--strip-components=1]
            creates: "{{ archipelago_root }}/python-{{ archipelago_tracker_python_version }}/bin/python3"

        - name: Create tracker directory
          ansible.builtin.file:
            path: "{{ archipelago_root }}/tracker"
            state: directory
            mode: "0755"

        - name: Install tracker files
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ archipelago_root }}/tracker/{{ item }}"
            mode: "0644"
          loop: [archipelago-tracker.py, archipelago_spoilers.py, tracker.html, spoilers.html]
          notify: Restart archipelago-tracker

        - name: Write tracker config
          ansible.builtin.copy:
            content: "{{ tracker_config | to_nice_json }}\n"
            dest: /etc/archipelago-tracker.json
            mode: "0600"
          vars:
            tracker_config:
              server: "ws://127.0.0.1:{{ archipelago_port }}"
              password: "{{ archipelago_password }}"
              slots: "{{ spoiler.stdout | regex_findall('Player \\d+: ([^\\r\\n]+)\\r?\\nGame:') }}"
              listen_host: "{{ archipelago_tracker_listen_host }}"
              listen_port: "{{ archipelago_tracker_listen_port | int }}"
              spoilers: "{{ archipelago_tracker_spoilers | bool }}"
              seed_zip: "{{ archipelago_seed_path }}"
              players_dir: "{{ archipelago_root }}/players"
          notify: Restart archipelago-tracker

        - name: Install tracker systemd unit
          ansible.builtin.template:
            src: archipelago-tracker.service.j2
            dest: /etc/systemd/system/archipelago-tracker.service
            mode: "0644"
          notify: Restart archipelago-tracker

        - name: Enable and start tracker
          ansible.builtin.systemd_service:
            name: archipelago-tracker
            enabled: true
            state: started
            daemon_reload: true

    - name: Show connection details
      ansible.builtin.debug:
        msg: "Hosting {{ archipelago_seed_path | basename }} at {{ inventory_hostname }}:{{ archipelago_port }}"

  handlers:
    - name: Restart archipelago
      ansible.builtin.systemd_service:
        name: archipelago
        state: restarted
        daemon_reload: true

    - name: Restart archipelago-discord
      ansible.builtin.systemd_service:
        name: archipelago-discord
        state: restarted
        daemon_reload: true

    - name: Restart archipelago-tracker
      ansible.builtin.systemd_service:
        name: archipelago-tracker
        state: restarted
        daemon_reload: true
