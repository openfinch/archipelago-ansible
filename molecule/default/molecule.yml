ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/inventory.yml
  playbooks:
    create: create.yml
    converge: ../../site.yml
    # Molecule skips "side_effect <file>" steps unless a default is set here.
    side_effect: regenerate.yml
    verify: verify.yml
    destroy: destroy.yml

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - side_effect regenerate.yml
    - verify
    - side_effect upload_seed.yml
    - verify
    - side_effect bad_password.yml
    - verify
    - destroy
