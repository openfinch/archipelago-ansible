# Characters that systemd would mangle in ExecStart must be rejected before
# anything is changed on the host.
- name: Reject unsafe passwords
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Run the playbook with an unsafe password
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python | dirname }}/ansible-playbook"
          - --inventory={{ playbook_dir }}/inventory.yml
          - "{{ playbook_dir }}/../../site.yml"
          - --extra-vars=archipelago_{{ item }}=bad%pw
      loop: [password, server_password]
      register: run
      changed_when: false
      failed_when: >-
        run.rc == 0
        or 'Passwords may only contain' not in run.stderr
