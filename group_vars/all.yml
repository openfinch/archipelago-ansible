# Release to install. When changing the version, update the checksum from the
# release page: https://github.com/ArchipelagoMW/Archipelago/releases
archipelago_version: "0.6.7"
archipelago_sha256: "b0d0ce90b5a9a0f1213991d37e1eb58f093e3c4eba2dfcd565bfbb79ac2a49fc"

archipelago_root: /opt/archipelago
archipelago_port: 38281

# Password players need to connect. Empty means no password.
archipelago_password: ""
# Password for the !admin command. Empty disables it.
archipelago_server_password: ""

# Extra ArchipelagoServer flags, for example:
#   ["--hint_cost", "5", "--release_mode", "enabled"]
archipelago_server_args: []

# Local path to a seed generated elsewhere (for example on archipelago.gg).
# When set, it is uploaded and hosted instead of generating on the server.
archipelago_seed_file: ""

# Set to true (-e archipelago_regenerate=true) to roll a new seed from players/.
archipelago_regenerate: false

# Local directory holding players/ and custom_worlds/.
archipelago_files_dir: "{{ playbook_dir }}"

# Discord webhook for item notifications. Empty disables the notifier.
# Set it (and the mentions below) in the gitignored host_vars/<host>.yml.
archipelago_discord_webhook_url: ""
# Slot name -> Discord user ID. Listed players are pinged when they receive
# an item; others are named in bold.
archipelago_discord_mentions: {}
# Address shown in the Discord welcome message.
archipelago_public_address: "{{ ansible_default_ipv4.address }}"
# Set to true (-e archipelago_discord_welcome=true) to repost the welcome.
archipelago_discord_welcome: false

# Web tracker. Empty listen host disables it. Set in host_vars, e.g. the
# Docker bridge IP a reverse proxy can reach.
archipelago_tracker_listen_host: ""
archipelago_tracker_listen_port: 38282
# The /spoilers page: item search and the checks needed to reach an item,
# plus every player's remaining locations. Off hides it and skips the work.
archipelago_tracker_spoilers: false
# The tracker's spoiler graph runs Archipelago's bundled libraries, which need
# the release's Python version (3.12 for 0.6.x). Standalone build from
# https://github.com/astral-sh/python-build-standalone/releases
archipelago_tracker_python_version: "3.12.14"
archipelago_tracker_python_release: "20260901"
archipelago_tracker_python_sha256: "936c246dfdbbfa7cb22dd01814a21f582a892689fae96b06071a5e433baffa22"
